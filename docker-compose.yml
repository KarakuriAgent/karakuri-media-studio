# Karakuri Media Studio を Docker で動かす。
#
#   docker compose up --build
#
# 設計:
# - リポジトリ全体をホストと同じ絶対パス (${PWD}) にマウントする。
#   app.db・runtime/config.json・ジョブ履歴には絶対パスが記録されているため、
#   パスを揃えることでホスト実行 (./run.sh) と Docker 実行を行き来できる。
# - `user:` にローカルユーザーの UID:GID を渡すので、コンテナが作るファイル
#   （outputs/ や app.db など）の所有者はローカルユーザーのままになる。
#   UID/GID が 1000 以外の場合は .env に UID=…/GID=… を書くか、
#   `UID=$(id -u) GID=$(id -g) docker compose up` のように渡す。
# - grok CLI はホストの ~/.grok（バイナリ＋サインイン状態）をそのまま
#   マウントして使う。事前にホスト側で `grok` のサインインを済ませておくこと。
# - フロントエンドのビルド (frontend/dist) はホスト側で行う:
#   `npm --prefix frontend install && npm --prefix frontend run build`
#   Remotion を使うなら `npm --prefix remotion install` も同じくホスト側で先に
#   済ませておく（コンテナに node はあるが、リポジトリはホストからマウントされる
#   ので node_modules もホスト側に置かれるため）。
#
# HOST / PORT は run.sh と同じく .env から読まれる（既定 127.0.0.1:8000）。
services:
  media-studio:
    build:
      context: .
      # ビルドコンテナ内で DNS が引けない環境があるためホスト側のネットワークを使う
      network: host
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: ${PWD}
    command: uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}
    environment:
      HOME: /home/app
      PYTHONPATH: ${PWD}/backend
      # 不足モデルの自動ダウンロード先（SPEC §3.3）。未設定なら空文字を渡し、
      # 機能ごと無効になる（下の volumes のダミーパスは渡さない）。
      COMFY_MODELS_DIR: ${COMFY_MODELS_DIR:-}
      # Cursor CLI（deploy/bin/cursor-agent がマウントした本体を起動する）を
      # PATH に足す。Dockerfile の PATH（~/.grok/bin 先頭）も含めて書き直す。
      PATH: ${PWD}/deploy/bin:/home/app/.grok/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    ports:
      - "${HOST:-127.0.0.1}:${PORT:-8000}:${PORT:-8000}"
    volumes:
      # ワークスペース＝データ（app.db / assets / library / outputs / runtime を含む）
      - .:${PWD}
      # grok CLI 本体とサインイン状態
      - ${HOME}/.grok:/home/app/.grok
      # codex CLI のサインイン状態（本体はイメージ側、Dockerfile 参照）
      - ${HOME}/.codex:/home/app/.codex
      # Cursor CLI 本体（~/.local/share/cursor-agent/versions/<版>/）とサインイン
      # 状態（~/.config/cursor/auth.json）・設定（~/.cursor）。事前にホスト側で
      # `cursor-agent login` を済ませておくこと。起動は deploy/bin/cursor-agent 経由。
      - ${HOME}/.local/share/cursor-agent:/home/app/.local/share/cursor-agent
      - ${HOME}/.config/cursor:/home/app/.config/cursor
      - ${HOME}/.cursor:/home/app/.cursor
      # 不足モデルの自動ダウンロード先（SPEC §3.3）: ホストの ComfyUI models
      # ディレクトリを**同一絶対パス**でマウントする。アプリは環境変数の値を
      # そのまま開くので、コンテナ内でも同じパスで見えている必要がある。
      # .env に COMFY_MODELS_DIR=/path/to/ComfyUI/models を書く。未設定のときは
      # 無害なダミーパスがマウントされるだけ（機能は UI ごと出ない）。
      - ${COMFY_MODELS_DIR:-/tmp/karakuri-no-models-dir}:${COMFY_MODELS_DIR:-/tmp/karakuri-no-models-dir}
      # 音源解析（SPEC §5.2）用の venv。torch / faster-whisper / stable-ts /
      # librosa はアプリの環境には入れず、backend/requirements-optional.txt を
      # 入れた別の venv を**同一絶対パス**でマウントして、設定
      # `audio_analysis_python` にその中の python を書く（README「音源解析」）。
      # リポジトリの中（例 .venv-audio/）に作れば `.:${PWD}` で既に見えている
      # ので、この行は外に置いたときだけ使う。
      # - ${AUDIO_ANALYSIS_VENV:-/tmp/karakuri-no-audio-venv}:${AUDIO_ANALYSIS_VENV:-/tmp/karakuri-no-audio-venv}
    # ローカルの ComfyUI を使う場合に host.docker.internal で届くようにする
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    restart: unless-stopped
