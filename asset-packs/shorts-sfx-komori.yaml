# 同梱の素材パック: 効果音（無料効果音で遊ぼう！）
# 入手元は無料効果音で遊ぼう！（小森平）だけ。候補を取り込み、長さ・ラウドネス・波形で選んだ 80 件
# （耳で聞いて選んだのではないので、使う前に聞いて確かめる）。
#
# この目録は Karakuri Media Studio に同梱している（asset-packs/README.md）。目録だけで、素材のファイルは入れていない
# （どの入手元も素材の再配布を禁止している）。入れると、スタジオが各素材を download_url から 1 件ずつ取りに行く
# （robots.txt を守り、interval_seconds 秒の間隔をあける）。
# 入れる前に、sources の terms_url（規約のページ）を開いて、terms_summary と checked_at（確かめた日）から
# 変わっていないかを確かめる。規約に同意した入手元だけを accept_sources に入れる。
# 入れ方: ライブラリの画面の「素材パック」か POST /api/v1/library/packs/bundled/{id}/install
# （docs/EXTERNAL-API.md §3.8）。aliases は前の id（その id で入れた素材も入れ済みと見なす）。
pack: shorts-sfx-komori
aliases:
- kanon-shorts-sfx
name: 効果音（無料効果音で遊ぼう！）
description: 短い動画（ショートのコメディなど）向けの効果音 80 件。衝撃・動き・ギャグ・決め・場の空気などの定番の音を、長さとラウドネスで選んだもの。入手元は無料効果音で遊ぼう！（小森平）。クレジットは規約上任意で、出どころの記録のために入手元の情報を残す
