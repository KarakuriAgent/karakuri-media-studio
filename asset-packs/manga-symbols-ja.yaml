# 同梱の素材パック: 漫画記号（集中線・漫符・吹き出し）
# 候補を取り込み、目で見て選んだ 137 件。動く漫符の file は配布元の拡張子（.mov・.mp4）のまま
# （.mov の ProRes 4444 は取り込みでアルファ付きの .webm になる）。グリーンバックの物はタグ「グリーンバック」と
# 説明に抜く色を書いてある（POST /library/{id}/key で抜ける）。ZIP でしか配っていない物は member に中のパス。
#
# この目録は Karakuri Media Studio に同梱している（asset-packs/README.md）。目録だけで、素材のファイルは入れていない
# （どの入手元も素材の再配布を禁止している）。入れると、スタジオが各素材を download_url から 1 件ずつ取りに行く
# （robots.txt を守り、interval_seconds 秒の間隔をあける）。
# 入れる前に、sources の terms_url（規約のページ）を開いて、terms_summary と checked_at（確かめた日）から
# 変わっていないかを確かめる。規約に同意した入手元だけを accept_sources に入れる。
# 入れ方: ライブラリの画面の「素材パック」か POST /api/v1/library/packs/bundled/{id}/install
# （docs/EXTERNAL-API.md §3.8）。aliases は前の id（その id で入れた素材も入れ済みと見なす）。
pack: manga-symbols-ja
aliases:
- kanon-shorts-manga-symbols
name: 漫画記号（集中線・漫符・吹き出し）
description: 映像の上に重ねる漫画記号 137 件（集中線・スピード線・漫符・吹き出し・動く漫符）。透過 PNG と、アルファ付きの動画（ProRes 4444 はアルファ付き WebM にして入る）・グリーンバックの動画。Remotion の FxOverlay の sprite / imageSlam / video に使える。クレジットはどの入手元も不要か任意で、出どころの記録のために入手元の情報を残す
